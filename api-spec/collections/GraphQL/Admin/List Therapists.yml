info:
  name: List Therapists
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      query ListTherapists {
        listTherapists {
          userId
          email
          firstName
          lastName
          displayName
          clinicName
          licenseNumber
          specialization
          activeChildCount
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

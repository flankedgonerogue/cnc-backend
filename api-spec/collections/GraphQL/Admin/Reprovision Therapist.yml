info:
  name: Reprovision Therapist
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |-
      mutation ReprovisionTherapist($therapistUserId: ID!) {
        reprovisionTherapist(therapistUserId: $therapistUserId) {
          userId
          deletedAt
        }
      }
    variables: |-
      {
        "therapistUserId": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

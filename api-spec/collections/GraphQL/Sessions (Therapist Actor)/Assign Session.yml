info:
  name: Assign Session
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      mutation AssignSession($dto: AssignSessionDto!) {
        assignSession(assignSessionInput: $dto) {
          id
          childId
          templateId
          status
          startedAt
        }
      }
    variables: |
      {
        "dto": {
          "childProfileId": "cmo1mpgug00065oq4lg8b69pj",
          "templateId": "cmo8c63gb00003sq4yj94ue6e"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

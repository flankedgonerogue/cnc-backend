info:
  name: Continue Story
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      mutation ContinueStory(
        $sessionId: String!
        $choiceId: String!
        $timeTakenMs: Int!
      ) {
        continueStory(
          sessionId: $sessionId
          choiceId: $choiceId
          timeTakenMs: $timeTakenMs
        ) {
          sessionId
          isEnding

          node {
            textContent
            imageUrl
            audioUrl
            confidenceScore
            choices {
              id
              text
            }
          }
        }
      }
    variables: |2-
      
       {
         "sessionId": "cmo8kx7gj0005u4q447hpoxc6",
         "choiceId": "cmo8lwunz0008l0q41yzdz1ag",
         "timeTakenMs": 5000.0
       }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Restart Story
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      mutation RestartStory($sessionId: String!) {
        restartStory(sessionId: $sessionId) {
          sessionId
          node {
            id
            textContent
            imageUrl
            audioUrl
            confidenceScore
            choices {
              id
              text
            }
          }
        }
      }
    variables: |2-
      
       {
         "sessionId": "cmo8cscia0000doq4mj4xjgfa"
       }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

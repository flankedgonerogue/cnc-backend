info:
  name: Create Template
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      mutation CreateTemplate($createData: CreateTemplateDto!) {
        createTemplate(createTemplateInput: $createData) {
          id
          targetBehavior
          setting
          mainCharacter
          emotionalTone
          visualStyle
          promptSuggestion
          createdAt
        }
      }
    variables: |
      {
        "createData": {
          "targetBehavior": "Stop fingering people",
          "setting": "Bedroom",
          "mainCharacter": "NomanElChupKabara",
          "emotionalTone": "NEUTRAL",
          "promptSuggestion": "Teach Noman to not finger other people",
          "visualStyle": "Cartoon style, bright colors"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

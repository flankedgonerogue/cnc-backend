info:
  name: Query Templates
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      query GetTemplates($take: Int, $skip: Int) {
        templates(take: $take, skip: $skip) {
          id
          targetBehavior
          setting
          mainCharacter
          emotionalTone
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

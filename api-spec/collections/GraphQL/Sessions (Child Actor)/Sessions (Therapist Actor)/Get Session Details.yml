info:
  name: Get Session Details
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      query GetSession($id: String!) {
        session(id: $id) {
          id
          status
          startedAt
          child {
            id
          }
          template {
            targetBehavior
            emotionalTone
          }
          nodes {
            id
            textContent
            choices {
              id
              text
            }
          }
        }
      }
    variables: |
      {
        "id": "cmo8cscia0000doq4mj4xjgfa"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

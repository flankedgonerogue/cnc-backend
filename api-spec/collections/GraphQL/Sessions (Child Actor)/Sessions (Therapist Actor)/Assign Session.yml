info:
  name: Assign Session
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      mutation AssignSession($dto: AssignSessionDto!) {
        assignSession(assignSessionInput: $dto) {
          id
          childId
          templateId
          status
          startedAt
        }
      }
    variables: |
      {
        "dto": {
          "childProfileId": "cmo97kx3s0001zwq48356zo7l",
          "templateId": "cmo97je4v0008xgq49igk77lj"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Set OAuth Role
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      mutation SetOAuthRole($role: String!) {
        setOAuthRole(setRoleInput: { role: $role }) {
          id
          email
          role
          firstName
          lastName
        }
      }
    variables: |
      {
        "role": "CHILD"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

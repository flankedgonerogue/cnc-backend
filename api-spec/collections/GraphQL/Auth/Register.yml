info:
  name: Register
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      mutation Register($email: String!, $password: String!, $role: String!, $firstName: String, $lastName: String) {
        register(registerInput: {
          email: $email,
          password: $password,
          role: $role,
          firstName: $firstName,
          lastName: $lastName
        }) {
          access_token
          user {
            id
            email
            role
            firstName
            lastName
          }
        }
      }
    variables: |
      {
        "email": "{{$randomEmail}}",
        "password": "{{$randomPassword}}",
        "role": "GUARDIAN",
        "firstName": "John",
        "lastName": "Doe"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

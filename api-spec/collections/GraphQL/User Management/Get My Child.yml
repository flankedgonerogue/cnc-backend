info:
  name: Get My Child
  type: graphql
  seq: 9

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      query GetMyChild {
        myChild {
          id
          email
          role
          firstName
          lastName
          displayName
          childProfile {
            id
            therapistId
            guardianId
          }
        }
      }
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN_GUARDIAN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

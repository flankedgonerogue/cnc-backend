info:
  name: Query Current User
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      query GetMe {
        me {
          id
          email
          role
          firstName
          lastName
          displayName
          avatarUrl
          timezone
          locale
          lastLoginAt
          createdAt
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

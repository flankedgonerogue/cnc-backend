info:
  name: List Therapists
  type: graphql
  seq: 8

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      query ListTherapists {
        therapists {
          id
          email
          firstName
          lastName
          displayName
          therapistProfile {
            id
            specialization
            clinicName
            bio
          }
        }
      }
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN_GUARDIAN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

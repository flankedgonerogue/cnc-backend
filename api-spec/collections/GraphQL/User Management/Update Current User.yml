info:
  name: Update Current User
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{BASE_URL}}/graphql"
  body:
    query: |
      mutation UpdateUser($id: String, $updateData: UpdateUserInput!) {
        updateUser(id: $id, updateUserInput: $updateData) {
          id
          email
          firstName
          lastName
          displayName
          avatarUrl
          timezone
          locale
        }
      }
    variables: |
      {
        "updateData": {
          "firstName": "John",
          "lastName": "Doe",
          "timezone": "America/New_York",
          "locale": "en-US"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
